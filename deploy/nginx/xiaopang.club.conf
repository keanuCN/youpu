# 有谱内测站（Next.js 静态导出产物）—— 与服务器 /www/server/panel/vhost/nginx/xiaopang.club.conf 保持一致
# 参数 URL 不进索引：静态站无法按查询串产出不同 HTML，用响应头代替 meta noindex
# （不能用 if + add_header：if 会创建隐式 location 并让 try_files 失效）
map $args $youpu_robots_tag {
    default "";
    "~(^|&)(sort|q)="  "noindex, follow";
}

server {
    listen 80;
    listen [::]:80;
    server_name xiaopang.club www.xiaopang.club 111.229.87.101;

    root /www/wwwroot/xiaopang.club;
    index index.html;

    access_log /www/wwwlogs/xiaopang.club.log;
    error_log /www/wwwlogs/xiaopang.club.error.log;

    add_header X-Robots-Tag $youpu_robots_tag always;

    # 静态站路由：$uri → $uri.html → $uri/index.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # 首页雪场图是路径固定的公开静态文件，不适合一年 immutable；短缓存并允许过期后后台重验证。
    # 不使用 always，避免浏览器缓存缺失图片的 404；正常文件响应显式保留站点 robots 头。
    location ^~ /hero/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        add_header X-Robots-Tag $youpu_robots_tag always;
    }

    error_page 404 /404.html;

    location /_next/static/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # API 由本机 systemd Node 服务提供，静态站与 API 使用同源地址
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
}
