# 新服务器的有谱域名入口；IP 默认站及 /youpu/ 保持原配置。
# TLS 证书通过 DNS 验证签发；续期需重新完成 DNS 验证。
server {
    listen 80;
    server_name youpu.asia www.youpu.asia;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/youpu-acme;
    }
    location / {
        return 301 https://youpu.asia$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name youpu.asia www.youpu.asia;
    ssl_certificate /etc/letsencrypt/live/youpu.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/youpu.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    if ($host = www.youpu.asia) {
        return 301 https://youpu.asia$request_uri;
    }

    location = /api/image-proxy {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
