  priceStatus: 英国官方页当前列价 GBP 99.99，页面原价 GBP 109.99；按 ECB 2026-10-14 GBP/EUR 0.84385、EUR/CNY 7.4925 折合 CNY 887.81。此前记录的 GBP 109.99（折合 CNY 976.60）已成为该页显示的原价。当前折算为英国促销参考，不是中国售价；页面未选定具体尺码结账，库存与运费税费另核。
