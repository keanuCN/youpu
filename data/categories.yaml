          - { value: 3U, label: 3U（约88g） }
          - { value: 5U, label: 5U（约78g） }
        filter: multi
        compare: true
        compareDirection: context
        order: 10

      - key: balance
        label: 平衡取向
        group: 重量与手感
        type: enum
        options:
          - { value: head-heavy, label: 头重 }
          - { value: even, label: 均衡 }
          - { value: head-light, label: 头轻 }
        filter: multi
        compare: true
        compareDirection: context
        order: 20

      - key: flex
        label: 杆身硬度
        group: 重量与手感
        type: enum
        options:
          - { value: extra-stiff, label: 特硬 Extra Stiff }
          - { value: stiff, label: 硬 Stiff }
          - { value: medium, label: 中等 Medium }
          - { value: hi-flex, label: 偏软 Hi-Flex }
        filter: multi
        compare: true
        compareDirection: context
        order: 30

      - key: maxTension
        label: 最高建议磅数
        group: 穿线与结构
        type: number
        unit: lbs
        min: 18
        max: 40
        filter: range
        compare: true
        compareDirection: higher-better
        order: 110

      - key: frameMaterial
        label: 拍框材料
        group: 穿线与结构
        type: text
        filter: false
        compare: true
        order: 120

      - key: shaftMaterial
        label: 中杆材料
        group: 穿线与结构
        type: text
        filter: false
        compare: true
        order: 130

      - key: lengthNote
        label: 长度说明
        group: 穿线与结构
        type: text
        filter: false
        compare: true
        order: 140

      - key: stringPattern
        label: 穿线建议
        group: 穿线与结构
        type: text
        filter: false
        compare: true
        order: 150

      - key: scenes
        label: 使用取向
        group: 使用取向
        type: enum[]
        options:
          - { value: singles, label: 单打 }
          - { value: doubles, label: 双打 }
          - { value: attack, label: 进攻 }
          - { value: control, label: 控制 }
          - { value: speed, label: 速度 }
        filter: multi
        compare: true
        order: 210

      - key: playerLevel
        label: 适合水平
        group: 使用取向
        type: enum
        options:
          - { value: beginner, label: 入门 }
          - { value: intermediate, label: 中级 }
          - { value: advanced, label: 进阶 }
        filter: multi
        compare: true
        order: 220

    rating_dimensions:
      - { key: power, label: 杀球力量, weight: 0.2 }
      - { key: control, label: 控球精度, weight: 0.2 }
      - { key: speed, label: 挥拍速度, weight: 0.18 }
      - { key: defense, label: 防守连贯, weight: 0.15 }
      - { key: forgiveness, label: 容错度, weight: 0.12 }
      - { key: value, label: 性价比, weight: 0.15 }

