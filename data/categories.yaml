- slug: badminton-racket
  name: 羽毛球拍
  parent: racket-sports
  sort_order: 10
  recommend_config:
    weights:
      playStyle: 0.4
      level: 0.3
      handling: 0.2
      price: 0.1
  spec_schema:
    fields:
      - key: weightClass
