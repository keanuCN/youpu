  geometryNotes: HEAD 25/26 手册与精确货号零售页将 Easy Joy R 对应 article 316485，列出五个长度及 163 cm 参考几何 117-70-103 mm、13.3 m。Winter Sports 同季页面另确认 article 316485 和 143/148/153/158/163 cm 长度选项，但仍只列 163 cm 参考几何。同货号 Esqui Outlet 页面明确列 158 cm 为 124-69-105 mm、10.7 m。148/153 cm 的韩国 OneEight 精确货号页分别列 R9.3/R10.1；Snowleader 2026 同名逐码表列 R10.5/R11.3，但未显示 HEAD article。由于同年款零售来源冲突，148/153 cm 半径已从前台逐码数据撤下，待原厂或第二个精确货号来源裁决。143 cm 仅保留 Snowleader 补充值（117-70-103 mm、R9.6），该页未显示 HEAD article；精确货号独立来源只确认该长度可选，故不称原厂逐码规格。原先相邻抽取文本将 316265 错配给 Easy Joy R；HEAD 官方商品页确认 316265 是 Shape VX R，故不再使用其货号、几何或图片。
  bindingCompatibility: 实际兼容性取决于固定器型号与靴底类型。核对 Alpine / GripWalk 标识、成人或儿童靴底及 BSL
    鞋底外壳长度（mm）；鞋码不能代替 BSL，GW 标识也不表示兼容所有巡游靴。
  mountingNotes: 按实际 SKU 核对是否含固定器、系统板/轨道与对应固定器；由专业店根据雪靴 BSL 调节并校验释放。商品标题出现系统名称不等于固定器已包含。
  seasonEvidence: HEAD Rental Handbook 2025/26 列明 EASY JOY R article 316485、五个长度及 163 cm 参考几何；同季零售页列出相同货号和规格。HEAD 官方商品页确认 316265 属于 Shape VX R。HEAD Hardgoods Workbook 搜索索引的跨栏文本顺序曾造成货号错配，按目录版面及独立货号记录纠正。
