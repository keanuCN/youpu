  priceStatus: Esqui Outlet 对 HEAD article 316485 + JOY 9 GW 固定器 100952 套装显示 EUR 259.99、参考价 EUR 400；按 ECB 2026-10-14 EUR/CNY 7.4925 折算为 CNY 1,947.98，继续作为主参考。Catti Sport 同货号页面本轮显示 EUR 249，折算 CNY 1,865.63；页面在线不可购提示与店内可售提示并存，库存不明，仅作价格线索，不覆盖主参考。韩国零售商 ONEEIGHT 同货号 + 固定器页面另显示 547,000 KRW（148/153 cm 选项），按 ECB 同日 EUR/KRW 1,496.54、EUR/CNY 7.4925 折算约 CNY 2,738.58，作为韩国市场交叉参考。波兰 Trojan Sport 的精确组合货号 316485#100952 曾列含税价 PLN 1,399（页面记录 2026-08-11 最低价），按 ECB 2026-10-14 EUR/PLN 4.3658、EUR/CNY 7.4925 折算为 CNY 2,400.94；核对时缺货，仅作历史地区参考。以上均为含固定器套装区域报价，不是中国售价或裸板价格；当前中国精确货号价格仍未核实，库存和结账费用另核。旧 Catti Sport EUR 299 报价作为先前采集记录保留在原始审计中。
