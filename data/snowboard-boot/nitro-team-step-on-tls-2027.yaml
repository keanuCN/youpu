  selectionNotes: "穿实际滑雪袜测量双脚脚长，以较长脚为准，按 Nitro 男款贴身 +5 mm、标准 +10 mm、宽松 +15 mm 的原厂建议选 Mondopoint；再试穿检查脚趾、脚背压力与锁跟。加量规则只适用 Nitro 指南，不替代试穿。Step On 还须按男款固定器尺码配套并确认连接点完全卡合。"
